<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 140" role="img" aria-label="Engineering stack: Network to Infrastructure to Automation to Compute to AI">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#79C0FF"/>
      <stop offset="100%" stop-color="#BC8CFF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#58A6FF" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="820" height="140" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle">
    <!-- NETWORK -->
    <g transform="translate(70, 70)" filter="url(#shadow)">
      <rect x="-52" y="-28" width="104" height="56" rx="8" fill="#161b22" stroke="#58A6FF" stroke-width="1.5"/>
      <text y="-4" fill="#58A6FF" font-size="11" font-weight="600" letter-spacing="1">NETWORK</text>
      <text y="14" fill="#8b949e" font-size="9">VLAN · SD-WAN</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 128 70 L 152 70" stroke="url(#glow)" stroke-width="2" fill="none"/>
    <polygon points="152,70 146,66 146,74" fill="#58A6FF"/>

    <!-- INFRASTRUCTURE -->
    <g transform="translate(230, 70)" filter="url(#shadow)">
      <rect x="-62" y="-28" width="124" height="56" rx="8" fill="#161b22" stroke="#58A6FF" stroke-width="1.5"/>
      <text y="-4" fill="#58A6FF" font-size="11" font-weight="600" letter-spacing="1">INFRASTRUCTURE</text>
      <text y="14" fill="#8b949e" font-size="9">Azure · IaC</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 298 70 L 322 70" stroke="url(#glow)" stroke-width="2" fill="none"/>
    <polygon points="322,70 316,66 316,74" fill="#58A6FF"/>

    <!-- AUTOMATION -->
    <g transform="translate(400, 70)" filter="url(#shadow)">
      <rect x="-58" y="-28" width="116" height="56" rx="8" fill="#161b22" stroke="#79C0FF" stroke-width="1.5"/>
      <text y="-4" fill="#79C0FF" font-size="11" font-weight="600" letter-spacing="1">AUTOMATION</text>
      <text y="14" fill="#8b949e" font-size="9">CI/CD · Scripts</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 462 70 L 486 70" stroke="url(#glow)" stroke-width="2" fill="none"/>
    <polygon points="486,70 480,66 480,74" fill="#79C0FF"/>

    <!-- COMPUTE -->
    <g transform="translate(564, 70)" filter="url(#shadow)">
      <rect x="-52" y="-28" width="104" height="56" rx="8" fill="#161b22" stroke="#BC8CFF" stroke-width="1.5"/>
      <text y="-4" fill="#BC8CFF" font-size="11" font-weight="600" letter-spacing="1">COMPUTE</text>
      <text y="14" fill="#8b949e" font-size="9">K8s · GPU</text>
    </g>

    <!-- Arrow 4 -->
    <path d="M 620 70 L 644 70" stroke="url(#glow)" stroke-width="2" fill="none"/>
    <polygon points="644,70 638,66 638,74" fill="#BC8CFF"/>

    <!-- AI -->
    <g transform="translate(730, 70)" filter="url(#shadow)">
      <rect x="-42" y="-28" width="84" height="56" rx="8" fill="#161b22" stroke="#BC8CFF" stroke-width="1.5"/>
      <text y="-4" fill="#BC8CFF" font-size="11" font-weight="600" letter-spacing="1">AI</text>
      <text y="14" fill="#8b949e" font-size="9">Agents · LLMs</text>
    </g>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 520" role="img" aria-label="Conceptual intelligence flow: Perception, Memory, Reasoning, Agents, Action across distributed compute">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#21262d" stroke-width="0.6"/>
    </pattern>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#BC8CFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pathBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#39C5CF"/>
      <stop offset="40%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#BC8CFF"/>
    </linearGradient>
    <linearGradient id="pathOut" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BC8CFF"/>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#58A6FF" flood-opacity="0.18"/>
    </filter>
    <filter id="dotGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Vertical spine -->
    <path id="spine1" d="M 450 102 L 450 140"/>
    <path id="spine2" d="M 450 186 L 450 224"/>
    <path id="spine3" d="M 450 294 L 450 330"/>
    <path id="spine4" d="M 450 376 L 450 414"/>

    <!-- Compute feeds into the core -->
    <path id="feedL" d="M 148 168 C 230 168, 260 248, 300 259"/>
    <path id="feedR" d="M 752 168 C 670 168, 640 248, 600 259"/>
    <path id="outL" d="M 300 365 C 240 365, 200 365, 148 365"/>
    <path id="outR" d="M 600 365 C 660 365, 700 365, 752 365"/>
  </defs>

  <rect width="900" height="520" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="898" height="518" rx="13" fill="url(#grid)" stroke="#30363d" stroke-width="1"/>
  <ellipse cx="450" cy="259" rx="210" ry="110" fill="url(#coreGlow)"/>

  <!-- Header -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <circle cx="28" cy="28" r="4" fill="#3FB950">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <text x="42" y="32" fill="#8b949e" font-size="11" letter-spacing="1.6">AI SYSTEM PULSE</text>
    <text x="872" y="32" fill="#6e7681" font-size="10" text-anchor="end" letter-spacing="0.8">CONCEPTUAL FLOW</text>
  </g>

  <!-- Slow orbital ring around reasoning -->
  <circle cx="450" cy="259" r="168" fill="none" stroke="#21262d" stroke-width="1"/>
  <circle cx="450" cy="259" r="168" fill="none" stroke="#58A6FF" stroke-width="1" stroke-dasharray="4 14" stroke-opacity="0.35">
    <animateTransform attributeName="transform" type="rotate" from="0 450 259" to="360 450 259" dur="42s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="259" r="198" fill="none" stroke="#BC8CFF" stroke-width="0.8" stroke-dasharray="2 18" stroke-opacity="0.22">
    <animateTransform attributeName="transform" type="rotate" from="360 450 259" to="0 450 259" dur="56s" repeatCount="indefinite"/>
  </circle>

  <!-- Spine paths -->
  <g fill="none" stroke-linecap="round">
    <path d="M 450 102 L 450 140" stroke="url(#pathBlue)" stroke-width="1.6"/>
    <path d="M 450 186 L 450 224" stroke="url(#pathBlue)" stroke-width="1.6"/>
    <path d="M 450 294 L 450 330" stroke="url(#pathOut)" stroke-width="1.6"/>
    <path d="M 450 376 L 450 414" stroke="url(#pathOut)" stroke-width="1.6"/>
    <path d="M 450 102 L 450 140" stroke="#58A6FF" stroke-width="1.6" stroke-dasharray="5 8" opacity="0.85">
      <animate attributeName="stroke-dashoffset" from="0" to="-39" dur="3.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 450 186 L 450 224" stroke="#58A6FF" stroke-width="1.6" stroke-dasharray="5 8" opacity="0.85">
      <animate attributeName="stroke-dashoffset" from="0" to="-39" dur="3.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 450 294 L 450 330" stroke="#BC8CFF" stroke-width="1.6" stroke-dasharray="5 8" opacity="0.85">
      <animate attributeName="stroke-dashoffset" from="0" to="-39" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 450 376 L 450 414" stroke="#3FB950" stroke-width="1.6" stroke-dasharray="5 8" opacity="0.85">
      <animate attributeName="stroke-dashoffset" from="0" to="-39" dur="4.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Side feeds -->
  <g fill="none" stroke-width="1.2" stroke-dasharray="4 7" opacity="0.55">
    <path d="M 148 168 C 230 168, 260 248, 300 259" stroke="#58A6FF">
      <animate attributeName="stroke-dashoffset" from="0" to="-33" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M 752 168 C 670 168, 640 248, 600 259" stroke="#58A6FF">
      <animate attributeName="stroke-dashoffset" from="0" to="-33" dur="5.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 300 365 C 240 365, 200 365, 148 365" stroke="#3FB950">
      <animate attributeName="stroke-dashoffset" from="0" to="-33" dur="5.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 600 365 C 660 365, 700 365, 752 365" stroke="#3FB950">
      <animate attributeName="stroke-dashoffset" from="0" to="-33" dur="5.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Traveling packets -->
  <g filter="url(#dotGlow)">
    <circle r="3.2" fill="#39C5CF">
      <animateMotion dur="4.8s" repeatCount="indefinite"><mpath href="#spine1" xlink:href="#spine1"/></animateMotion>
    </circle>
    <circle r="3.2" fill="#58A6FF">
      <animateMotion dur="5s" begin="0.8s" repeatCount="indefinite"><mpath href="#spine2" xlink:href="#spine2"/></animateMotion>
    </circle>
    <circle r="3.2" fill="#BC8CFF">
      <animateMotion dur="5.2s" begin="0.4s" repeatCount="indefinite"><mpath href="#spine3" xlink:href="#spine3"/></animateMotion>
    </circle>
    <circle r="3.2" fill="#3FB950">
      <animateMotion dur="5.4s" begin="1.1s" repeatCount="indefinite"><mpath href="#spine4" xlink:href="#spine4"/></animateMotion>
    </circle>
    <circle r="2.6" fill="#58A6FF">
      <animateMotion dur="6.4s" repeatCount="indefinite"><mpath href="#feedL" xlink:href="#feedL"/></animateMotion>
    </circle>
    <circle r="2.6" fill="#79C0FF">
      <animateMotion dur="6.6s" begin="1.6s" repeatCount="indefinite"><mpath href="#feedR" xlink:href="#feedR"/></animateMotion>
    </circle>
    <circle r="2.6" fill="#3FB950">
      <animateMotion dur="6.8s" begin="0.7s" repeatCount="indefinite"><mpath href="#outL" xlink:href="#outL"/></animateMotion>
    </circle>
    <circle r="2.6" fill="#56D364">
      <animateMotion dur="7s" begin="2s" repeatCount="indefinite"><mpath href="#outR" xlink:href="#outR"/></animateMotion>
    </circle>
  </g>

  <!-- Capability nodes -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle" filter="url(#soft)">
    <!-- PERCEPTION -->
    <g transform="translate(450, 79)">
      <rect x="-110" y="-23" width="220" height="46" rx="8" fill="#161b22" stroke="#39C5CF" stroke-width="1.4"/>
      <rect x="-110" y="-23" width="5" height="46" rx="2" fill="#39C5CF"/>
      <circle cx="88" cy="0" r="3.5" fill="#39C5CF">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text y="4" fill="#e6edf3" font-size="12" font-weight="600" letter-spacing="2">PERCEPTION</text>
    </g>

    <!-- MEMORY -->
    <g transform="translate(450, 163)">
      <rect x="-110" y="-23" width="220" height="46" rx="8" fill="#161b22" stroke="#58A6FF" stroke-width="1.4"/>
      <rect x="-110" y="-23" width="5" height="46" rx="2" fill="#58A6FF"/>
      <circle cx="88" cy="0" r="3.5" fill="#58A6FF">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <text y="4" fill="#e6edf3" font-size="12" font-weight="600" letter-spacing="2">MEMORY</text>
    </g>

    <!-- REASONING CORE -->
    <g transform="translate(450, 259)">
      <rect x="-150" y="-35" width="300" height="70" rx="10" fill="#12161d" stroke="#BC8CFF" stroke-width="1.6"/>
      <rect x="-150" y="-35" width="6" height="70" rx="2" fill="#BC8CFF"/>
      <circle cx="0" cy="0" r="46" fill="none" stroke="#BC8CFF" stroke-opacity="0.18" stroke-width="1">
        <animate attributeName="r" values="40;52;40" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.28;0.06;0.28" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <text y="-4" fill="#e6edf3" font-size="13" font-weight="600" letter-spacing="2.2">REASONING</text>
      <text y="16" fill="#8b949e" font-size="9" letter-spacing="1.4">DISTRIBUTED AI CORE</text>
    </g>

    <!-- AGENTS -->
    <g transform="translate(450, 353)">
      <rect x="-110" y="-23" width="220" height="46" rx="8" fill="#161b22" stroke="#79C0FF" stroke-width="1.4"/>
      <rect x="-110" y="-23" width="5" height="46" rx="2" fill="#79C0FF"/>
      <circle cx="88" cy="0" r="3.5" fill="#79C0FF">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <text y="4" fill="#e6edf3" font-size="12" font-weight="600" letter-spacing="2">AGENTS</text>
    </g>

    <!-- ACTION -->
    <g transform="translate(450, 437)">
      <rect x="-110" y="-23" width="220" height="46" rx="8" fill="#161b22" stroke="#3FB950" stroke-width="1.4"/>
      <rect x="-110" y="-23" width="5" height="46" rx="2" fill="#3FB950"/>
      <circle cx="88" cy="0" r="3.5" fill="#3FB950">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <text y="4" fill="#e6edf3" font-size="12" font-weight="600" letter-spacing="2">ACTION</text>
    </g>
  </g>

  <!-- Distributed compute nodes (generic, not a topology) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" text-anchor="middle">
    <g transform="translate(110, 168)">
      <polygon points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10" fill="#161b22" stroke="#58A6FF" stroke-width="1.3"/>
      <circle r="4" fill="#58A6FF">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite"/>
      </circle>
      <text y="36" fill="#8b949e" font-size="10" letter-spacing="1.5">LOCAL</text>
    </g>
    <g transform="translate(790, 168)">
      <polygon points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10" fill="#161b22" stroke="#BC8CFF" stroke-width="1.3"/>
      <circle r="4" fill="#BC8CFF">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <text y="36" fill="#8b949e" font-size="10" letter-spacing="1.5">GPU</text>
    </g>
    <g transform="translate(110, 365)">
      <polygon points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10" fill="#161b22" stroke="#39C5CF" stroke-width="1.3"/>
      <circle r="4" fill="#39C5CF">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <text y="36" fill="#8b949e" font-size="10" letter-spacing="1.5">EDGE</text>
    </g>
    <g transform="translate(790, 365)">
      <polygon points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10" fill="#161b22" stroke="#3FB950" stroke-width="1.3"/>
      <circle r="4" fill="#3FB950">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3.8s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <text y="36" fill="#8b949e" font-size="10" letter-spacing="1.5">CLOUD</text>
    </g>
  </g>

  <!-- Abstract satellite compute dots -->
  <g fill="#58A6FF">
    <circle cx="318" cy="214" r="2.2" opacity="0.45">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="582" cy="214" r="2.2" opacity="0.45">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="318" cy="304" r="2.2" fill="#BC8CFF" opacity="0.45">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="582" cy="304" r="2.2" fill="#BC8CFF" opacity="0.45">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5.2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="450" y="498" text-anchor="middle" fill="#6e7681" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" letter-spacing="0.4">Not a deployment map - capability flow across heterogeneous compute</text>
</svg>
